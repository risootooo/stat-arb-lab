[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "statarb-lab"
version = "1.0.0"
description = "Statistical-arbitrage research on real data: Engle-Granger pairs, Kalman hedge ratios and dual momentum, with honest case studies"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest", "yfinance"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
